model:
  provider: deepseek
  api-key-env: DEEPSEEK_API_KEY
  model: deepseek-v4-flash
  base-url: https://api.deepseek.com
  connect-timeout-seconds: 10
  request-timeout-seconds: 60
# SSE 已连接但长时间没有任何数据时中止本次模型调用
  stream-idle-timeout-seconds: 30
# 价格是请求发生时写入 Session 的快照；调价时必须修改 version 和费率
  pricing:
    version: deepseek-v4-flash-2026-08-19-cny
    currency: CNY
    input-per-million: "1.00"
    cache-read-per-million: "0.02"
    cache-write-per-million: "0"
    output-per-million: "2.00"
  retry:
    max-retries: 2
    initial-delay-ms: 500
    max-delay-ms: 4000

agent:
# 可配置的 Turn 最大 Step 数，防止模型无限调用工具
  max-steps-per-turn: 8
# 包含所有模型和工具调用的 Turn 总超时
  turn-timeout-seconds: 120

session:
  path: .runtime/session.jsonl

workspace:
  root: .
  read-file-max-bytes: 1048576
